name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:   # يتيح تشغيل البناء يدوياً من صفحة Actions

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. إعداد Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. إعداد Android SDK (API 34 + Build Tools)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. إعداد Gradle 8.6 (متوافق مع AGP 8.3.x)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      # 5. بناء Debug APK
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # 6. رفع الـ APK كملف قابل للتحميل من صفحة Actions
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MedLinkYemen-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
